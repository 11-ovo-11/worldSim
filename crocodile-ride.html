<button id="toggle" type="button" aria-pressed="false">暂停兜风</button></main>
<script>
const scene=document.getElementById('scene'),button=document.getElementById('toggle');
let paused=false;
button.addEventListener('click',()=>{paused=!paused;scene.classList.toggle('paused',paused);if(paused)scene.pauseAnimations();else scene.unpauseAnimations();button.textContent=paused?'继续兜风':'暂停兜风';button.setAttribute('aria-pressed',String(paused));});
</script>
